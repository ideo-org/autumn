version: '3'

tasks:
  setup:
    desc: Initial project setup
    cmds:
      - bun install
      - bun setup

  db:push:
    desc: Push database schema (Drizzle)
    cmds:
      - bun db:push

  db:generate:
    desc: Generate Drizzle migrations
    cmds:
      - bun db:generate

  db:migrate:
    desc: Run Drizzle migrations
    deps: [db:generate]
    cmds:
      - bun db:migrate

  redis:
    desc: Start Redis using redis-server (Direct)
    cmds:
      - redis-server

  redis:docker:
    desc: Start a persistent Redis container (Valkey)
    cmds:
      - docker rm -f autumn-redis || true
      - docker run -d --name autumn-redis -p 6379:6379 -v autumn-redis-data:/data valkey/valkey:8.0

  db:
    desc: Start a persistent local Postgres container
    cmds:
      - docker rm -f autumn-postgres || true
      - docker run --name autumn-postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres -v autumn-postgres-data:/var/lib/postgresql/data postgres:16
    finally:
      - cmds:
        - docker stop autumn-postgres
        - docker rm autumn-postgres

  server:
    desc: Start the backend server
    cmds:
      - cd server && bun dev

  vite:
    desc: Start the frontend (Vite)
    cmds:
      - cd vite && bun dev

  workers:
    desc: Start the BullMQ workers
    cmds:
      - cd server && bun workers:dev

  compose:
    desc: Start backend, frontend, and workers concurrently
    deps: [server, vite, workers]

  default:
    desc: Alias for compose
    cmds:
      - task: compose
